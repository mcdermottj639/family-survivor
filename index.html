<!doctype html>
<html lang="en" data-palette="champagne" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Survivor League</title>
<meta name="description" content="The family survivor football league — make your pick, see the standings.">
<meta name="theme-color" content="#16301f">

<!-- iOS Home Screen. An apple-touch-icon MUST be a PNG — Safari ignores an
     SVG one and falls back to a screenshot of the page, which is the last
     thing you want as grandma's icon. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Survivor">
<meta name="format-detection" content="telephone=no">
<script>
  // Palette + big-text before first paint, so nothing flashes.
  try {
    // Always open light unless the person has chosen dark on this phone.
    // Following the OS meant half the family got a dark app they never asked
    // for, and dark is the harder read for aging eyes.
    var p = localStorage.getItem('survivor:palette') || 'champagne';
    document.documentElement.setAttribute('data-palette', p);
    document.documentElement.setAttribute('data-theme', p === 'onyx' ? 'dark' : 'light');
    if (localStorage.getItem('survivor:big') === '1') document.documentElement.setAttribute('data-big', '1');
    // Paint the notch/status bar to match before the first frame.
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', p === 'onyx' ? '#14130f' : '#16301f');
  } catch (e) {}
</script>
<link rel="stylesheet" href="survivor.css?v=52">
<!-- The condensed face is SELF-HOSTED, like everything else here. A CDN font
     would be a third-party request the service worker is not allowed to cache,
     so the app would lose its own typography the moment a phone went offline —
     and offline is a normal state in a stadium car park. Latin subset only,
     three weights, ~67KB the whole way. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/barlow-condensed-800.woff2" crossorigin>
</head>
<body>

<!-- 🚨 ONE sticky band, not three stacked strips that scroll away.
     The brand, the week, the "viewing as" warning and the tabs are all the
     same thing — where you are and how you move — and on a pick screen
     sixteen games long they all left the top of the phone together. That
     included the red bar saying you are picking as SOMEBODY ELSE, which is
     the one thing in this app that must never be off-screen.
     ⚠️ `.hd`, `#viewas` and `#tabs` stay separate elements inside it so
     INERT_WHILE_OPEN still finds each of them by its own selector. -->
<div class="topbar">
<header class="hd">
  <div class="hd-in">
    <div class="hd-brand">
      <span class="hd-ball">🏈</span>
      <span class="hd-name">Family Survivor</span>
      <span class="hd-wk" id="hd-wk"></span>
    </div>
    <div class="hd-right">
      <button id="big-btn" class="hd-btn" type="button" title="Bigger text" aria-label="Bigger text"><span class="hb-i">A<sup>+</sup></span><span class="hb-l">Text</span></button>
      <button id="pal-btn" class="hd-btn" type="button" title="Switch between light and dark" aria-label="Switch between light and dark"><span class="hb-i">◐</span><span class="hb-l">Theme</span></button>
    </div>
  </div>
  <div id="whoami" class="hd-who" hidden></div>
</header>

<div id="viewas" class="viewbar" hidden></div>

<nav class="tabs" id="tabs" role="tablist" hidden>
  <button role="tab" aria-selected="true" data-screen="pick"      class="tab on">Pick</button>
  <button role="tab" data-screen="standings" aria-selected="false" class="tab">Standings</button>
  <button role="tab" data-screen="history"   aria-selected="false" class="tab">My Picks</button>
  <button role="tab" data-screen="stats"     aria-selected="false" class="tab">Stats</button>
  <button role="tab" data-screen="admin"     aria-selected="false" class="tab" id="tab-admin" hidden>Admin</button>
</nav>
</div>

<main id="main">
  <div id="boot" class="boot">Loading…</div>
  <section role="tabpanel" aria-label="Pick" id="s-pick"      class="screen" hidden></section>
  <section role="tabpanel" aria-label="Standings" id="s-standings" class="screen" hidden></section>
  <section role="tabpanel" aria-label="History" id="s-history"   class="screen" hidden></section>
  <section role="tabpanel" aria-label="Stats" id="s-stats"     class="screen" hidden></section>
  <section role="tabpanel" aria-label="Admin" id="s-admin"     class="screen" hidden></section>
</main>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Matchup details">
  <div class="sheet-back" data-close="1"></div>
  <div class="sheet-card">
    <button id="sheet-close" class="sheet-x" type="button" data-close="1" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="confirm" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cf-title">
  <div class="sheet-back" data-cfcancel="1"></div>
  <div class="sheet-card cf-card">
    <div id="confirm-body"></div>
  </div>
</div>

<footer class="ft">
  <span id="ft-mode"></span>
</footer>

<script src="survivor.js?v=52"></script>
</body>
</html>
