# Publish the app to GitHub Pages.
#
# ⚠️ This workflow exists to TURN PAGES ON and to keep it on — nothing more.
# It builds nothing, because there is nothing to build: the app is the files
# as written, which is the whole point of it. `configure-pages` with
# `enablement: true` switches Pages on via the API the first time this runs,
# which is why the workflow exists at all rather than the repo just using
# "Deploy from branch".
#
# 🔁 Once it has run green once, "Deploy from branch" (Settings → Pages →
# Source) is the simpler arrangement and this file can be deleted: a push
# would then reach the phones with nothing in between that can fail. Keep
# whichever you prefer, but do not run both.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win, but never cancel a deploy that is mid-flight —
# a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The whole repo IS the site. `tests/` and the docs ride along; they
      # are a few hundred KB and nothing links to them.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
